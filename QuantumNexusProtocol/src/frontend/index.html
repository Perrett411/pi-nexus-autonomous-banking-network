<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Function Drive — Live Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Quantum Function Drive</h1>
        <div class="live-badge">
            <span class="dot" id="live-dot"></span>
            <span id="live-status">CONNECTING</span>
        </div>
    </header>
    <main>
        <section class="stats-grid" aria-label="Drive statistics">
            <div class="stat-card">
                <span class="stat-label">Transactions</span>
                <span class="stat-value" id="stat-transactions">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Consensus Updates</span>
                <span class="stat-value" id="stat-consensus">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Validators</span>
                <span class="stat-value" id="stat-validators">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Blocks Finalized</span>
                <span class="stat-value" id="stat-blocks">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Audit Chain</span>
                <span class="stat-value ok" id="stat-integrity">…</span>
            </div>
            <div class="stat-card wide">
                <span class="stat-label">Audit Merkle Root</span>
                <span class="stat-value mono" id="stat-merkle">…</span>
            </div>
        </section>

        <section class="feeds">
            <div class="feed-panel">
                <h2>Transaction Stream</h2>
                <div id="transactions-feed" class="feed" aria-live="polite"></div>
            </div>
            <div class="feed-panel">
                <h2>Consensus Updates</h2>
                <div id="consensus-feed" class="feed" aria-live="polite"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>Every transaction and consensus change is hash-chained in the Quantum Nexus audit log.</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
