services:
  dashboard:
    image: python:3.12-slim
    container_name: qnp-dashboard
    working_dir: /app/QuantumNexusProtocol/src/frontend
    command: sh -c "pip install --no-cache-dir -q flask && python dashboard_server.py"
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: unless-stopped
